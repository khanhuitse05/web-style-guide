        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #081425;
            color: #d8e3fb;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        #preview-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(#1f2a3c 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 20px;
            overflow: hidden;
        }

        #preview-frame {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            border: 1px solid #2a3548;
        }

        /* Device Sizes */
        .device-desktop {
            width: 100% !important;
            height: 100% !important;
        }

        .device-tablet {
            width: 768px !important;
            height: 1024px !important;
            max-height: 100%;
        }

        .device-mobile {
            width: 375px !important;
            height: 812px !important;
            max-height: 100%;
        }

        /* Code Snippet Panel */
        #code-panel {
            position: fixed;
            top: 64px;
            right: -600px;
            width: 600px;
            bottom: 0;
            background: #111c2d;
            border-left: 1px solid #2a3548;
            transition: right 0.3s ease;
            z-index: 50;
            display: flex;
            flex-direction: column;
        }

        #code-panel.open {
            right: 0;
        }

        pre {
            margin: 0;
            padding: 1rem;
            overflow-x: auto;
            font-size: 13px;
            color: #e2e2e2;
        }
    </style>
</head>

        let requestedId = normalizedPath.split('/').pop().replace('.html', '');

        // Find current style index
        let currentIndex = -1;
        if (normalizedPath) {
            currentIndex = stylesData.findIndex(s => 
                s.path === normalizedPath || 
                s.path === rawStyleParam || 
                s.id === normalizedPath ||
                s.id === requestedId ||
                s.path.endsWith(normalizedPath)
            );
        }

        let requestedPath;

            currentStyle = stylesData[currentIndex];
            requestedPath = currentStyle.path;
        } else if (normalizedPath) {
            // If requested style is not found in predefined list, still display the requested style!
            const fallbackTitle = requestedId
                .replace(/[_-]/g, ' ')
                .replace(/\b\w/g, l => l.toUpperCase());
            currentStyle = {
                id: requestedId,
                path: normalizedPath,
                title: fallbackTitle,
                category: 'Style Showcase'
            };
            requestedPath = normalizedPath;
        } else {
            currentIndex = 0;
            currentStyle = stylesData[0];
            requestedPath = currentStyle.path;

            }
        });
        btnNext.addEventListener('click', () => {
            if (currentIndex >= 0 && currentIndex < stylesData.length - 1) {
                window.location.href = `showcase.html?style=${stylesData[currentIndex + 1].path}`;
            }
        });

        // Disable Prev/Next if at boundaries or invalid index
        if (currentIndex <= 0) {
            btnPrev.style.opacity = '0.5';
            btnPrev.style.cursor = 'not-allowed';
        }
        if (currentIndex === -1 || currentIndex >= stylesData.length - 1) {
            btnNext.style.opacity = '0.5';
            btnNext.style.cursor = 'not-allowed';
        }

        // Keyboard navigation (Left / Right arrow keys)
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft' && currentIndex > 0) {
                window.location.href = `showcase.html?style=${stylesData[currentIndex - 1].path}`;
            } else if (e.key === 'ArrowRight' && currentIndex >= 0 && currentIndex < stylesData.length - 1) {
                window.location.href = `showcase.html?style=${stylesData[currentIndex + 1].path}`;
            }
        });

        // Device Toggles
        const deviceBtns = document.querySelectorAll('.device-btn');
        deviceBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                deviceBtns.forEach(b => b.classList.remove('text-white', 'bg-[#2a3548]'));
                btn.classList.add('text-white', 'bg-[#2a3548]');
                frame.className = btn.dataset.device;
            });
        });

        // Code Panel Toggle
        const codePanel = document.getElementById('code-panel');
        document.getElementById('toggle-code').addEventListener('click', () => codePanel.classList.add('open'));
        document.getElementById('close-code').addEventListener('click', () => codePanel.classList.remove('open'));

        // Load Source Code
        // Attempt fetch first (works on servers), fallback to iframe reading (might work on some file://), then error out.
        const setSourceCode = (code) => {
            document.getElementById('code-block').textContent = code;
        };

        const tryReadFromFrame = () => {
            try {
                if (frame.contentDocument && frame.contentDocument.documentElement) {
                    const html = frame.contentDocument.documentElement.outerHTML;
                    if (html && html.trim().length > 0) {
                        setSourceCode('<!DOCTYPE html>\n' + html);
                        return true;
                    }
                }
            } catch (e) { }
            return false;
        };

        frame.addEventListener('load', () => {
            if (document.getElementById('code-block').textContent === 'Loading...') {
                tryReadFromFrame();
            }
        });

        fetch(requestedPath)
            .then(response => {
                if (!response.ok) throw new Error("Network response was not ok");
                return response.text();
            })
            .then(html => {
                setSourceCode(html);
            })
            .catch(err => {
                // If fetch fails (likely due to CORS on file:// protocol), try reading from the loaded iframe
                if (!tryReadFromFrame()) {
                    setTimeout(() => {
                        if (document.getElementById('code-block').textContent === 'Loading...') {
                            if (!tryReadFromFrame()) {
                                setSourceCode('// Failed to load source code.\n// This is likely because you are opening the file directly (file:// protocol) which blocks local file reading for security.\n// Please run a local development server (e.g., using VSCode Live Server or running `npx serve` in the terminal) to view the source code.');
                            }
                        }
                    }, 500);
                }
            });

        // Copy Code
        document.getElementById('copy-code').addEventListener('click', (e) => {
            const text = document.getElementById('code-block').textContent;
            navigator.clipboard.writeText(text);
            const btn = e.currentTarget;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined text-[14px]">check</span> Copied`;
            setTimeout(() => btn.innerHTML = originalHtml, 2000);
        });

        // Playground
        const pgContainer = document.getElementById('playground-controls');
        if (currentStyle.playground && currentStyle.playground.length > 0) {
            pgContainer.style.display = 'block';
            const sliderContainer = document.getElementById('slider-container');

            currentStyle.playground.forEach(control => {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = `
                    <div class="flex justify-between text-xs text-[#d8e3fb] mb-1">
                        <span>${control.name}</span>
                        <span id="val-${control.var}">${control.val}${control.unit}</span>
                    </div>
                    <input type="range" min="${control.min}" max="${control.max}" value="${control.val}" class="w-full accent-primary">
                `;
                const input = wrapper.querySelector('input');
                const valDisplay = wrapper.querySelector(`span#val-${control.var}`);

                input.addEventListener('input', (e) => {
                    const val = e.target.value;
                    valDisplay.textContent = `${val}${control.unit}`;
                    // Inject CSS var into iframe
                    try {
                        frame.contentWindow.document.documentElement.style.setProperty(control.var, `${val}${control.unit}`);
                    } catch (e) { }
                });

                sliderContainer.appendChild(wrapper);
            });
        }
    </script>
</body>

</html>
